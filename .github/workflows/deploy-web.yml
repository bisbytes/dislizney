# Builds the web app on every push to main and pull request, so a broken web
# export is caught early. Publishing to GitHub Pages stays off until you turn it on.
#
# To go live (one time):
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > Variables: PUBLISH_SITE = true.
# Custom domain (e.g. line.bisbytes.com): add it in Settings > Pages and a CNAME DNS record
# pointing to bisbytes.github.io. The base path and health check adjust on their own.
# To take the site down again, set PUBLISH_SITE to false and unpublish in Settings > Pages.
name: Deploy web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site only publishes if the tests pass.
      - run: npm test

      - name: Find the site's base path
        id: pages
        if: github.event_name != 'pull_request' && vars.PUBLISH_SITE == 'true'
        uses: actions/configure-pages@v5

      # GitHub Pages has no URL rewrites, so the deploy uses a single-page build
      # (404.html serves the app for deep links like /park/magic-kingdom) under the
      # base path from Pages: /dislizney, or empty (the root) with a custom domain.
      # app.json itself is left alone, so local dev is unchanged.
      - name: Configure web build for GitHub Pages
        env:
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          REPO_BASE: /${{ github.event.repository.name }}
        run: |
          # Use the Pages base path whenever Pages answered, even when it's empty
          # (a custom domain like line.bisbytes.com serves from the root).
          # Pull requests don't ask Pages, so they build for the repo sub-path.
          if [ "$PAGES_OUTCOME" = success ]; then base=$PAGES_BASE; else base=$REPO_BASE; fi
          echo "Base path: '${base}'"
          jq --arg base "$base" \
            '.expo.web.output = "single" | if $base == "" then del(.expo.experiments.baseUrl) else .expo.experiments.baseUrl = $base end' \
            app.json > app.pages.json
          mv app.pages.json app.json

      - name: Export web
        run: npx expo export --platform web
        env:
          EXPO_OFFLINE: 1
          # Address of the public board Worker (repo variable). Unset hides the board.
          EXPO_PUBLIC_BOARD_URL: ${{ vars.BOARD_URL }}

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.PUBLISH_SITE == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && vars.PUBLISH_SITE == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
